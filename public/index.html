<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Self-driving car - No Libraries</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <canvas id="carCanvas"></canvas>
    <div id="verticalButtons">
      <button id="toggleButton" onclick="toggleCarMode()" title="Toggle between RL and Neural Network mode">🔄</button>
      <button id="saveButton" onclick="save()" title="Save current AI to localStorage">💾</button>
      <button id="discardButton" onclick="discard()" title="Discard current AI from localStorage">🗑️</button>
      <button id="exportButton" onclick="saveQTableToFile()" title="Export current AI to JSON file">📤</button>
      <button id="importButton" onclick="document.getElementById('fileInput').click()" title="Import AI from JSON file">📥</button>
      <button id="enhancedButton" onclick="toggleEnhancedNN()" title="Toggle Enhanced Neural Network (NN mode only)">⚡</button>
      <!-- <button id="configButton" onclick="toggleConfig()" title="Open Configuration Panel">⚙️</button> -->
      <button id="helpButton" onclick="toggleHelp()" title="Show Help and Controls">❓</button>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadQTableFromFile(event)">
    <canvas id="networkCanvas"></canvas>
    <script src="/src/js/utils_rl.js"></script>
    <script src="/src/js/rl_agent.js"></script>
    <script src="/src/js/dqn_agent.js"></script>
    <script src="/src/js/network.js"></script>
    <script src="/src/js/enhanced_neural_network.js"></script>
    <script src="/src/js/performance_monitor.js"></script>
    <script src="/src/js/simulation_config.js"></script>
    <script src="/src/js/help_system.js"></script>
    <script src="/src/js/visualizer.js"></script>
    <script src="/src/js/sensor.js"></script>
    <script src="/src/js/utils.js"></script>
    <script src="/src/js/road.js"></script>
    <script src="/src/js/controls.js"></script>
    <script src="/src/js/car.js"></script>
    <script src="/src/js/main.js"></script>
  </body>
</html>
